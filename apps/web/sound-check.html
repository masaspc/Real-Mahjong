<html lang="ja">
  <head>

    <title>音の確かめ</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #123b26;
        color: #f2ecd9;

      h1 { margin: 0 0 4px; font-size: 18px; }

  <body>

    <div id="report">測っています…</div>
