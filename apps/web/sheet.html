<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>牌姿一覧</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #123b26;
        color: #f2ecd9;
        font-family: system-ui, sans-serif;
      }
      h1 { margin: 0 0 4px; font-size: 18px; }
      p { margin: 0 0 20px; font-size: 13px; opacity: .8; }
      .row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
      .cell { width: 64px; text-align: center; }
      /* 牌の地色は 3D と同じ。`face-atlas.ts` の BODY_FILL_COLOR を写す */
      .cell .face {
        display: block;
        width: 64px;
        height: 82px;
        padding: 3px;
        border-radius: 6px;
        background: #f0e6c8;
        box-shadow: 0 3px 0 #b0a074, 0 4px 6px rgba(0, 0, 0, .4);
      }
      .cell .face svg { display: block; width: 100%; height: 100%; }
      .cell span { display: block; margin-top: 5px; font-size: 11px; opacity: .85; }
    </style>
  </head>
  <body>
    <h1>牌姿一覧</h1>
    <p>37種と裏面。3D を経由しない。牌の地色は卓と同じ。</p>
    <div id="sheet"></div>
    <script type="module" src="/src/sheet.ts"></script>
  </body>
</html>
