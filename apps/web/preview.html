<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>卓の見た目を確かめる</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d1b12;
        color: #e8e4d8;
        font-family: system-ui, sans-serif;
      }
      #table {
        display: block;
        width: 100%;
        height: 100%;
      }
      #panel {
        position: fixed;
        top: 12px;
        left: 12px;
        padding: 10px 14px;
        background: #0009;
        border-radius: 8px;
        font-size: 13px;
        line-height: 1.7;
      }
      #viewer {
        margin-top: 6px;
        padding: 4px 10px;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <canvas id="table"></canvas>
    <div id="panel">
      <div><strong>動かない盤面。対局しないで見た目だけを見る</strong></div>
      <div>自分=チー+ポン / 下家=大明槓 / 対面=暗槓+リーチ / 上家=加槓</div>
      <div id="viewer-label">見ている席: 0</div>
      <button id="viewer" type="button">見る席を変える</button>
    </div>
    <script type="module" src="/src/preview.ts"></script>
  </body>
</html>
